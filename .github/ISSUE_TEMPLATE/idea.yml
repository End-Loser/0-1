name: 说出一个想法
description: 一句话也可以；通过审核后会整理进 ideas/
title: "[想法] "
labels:
  - idea
  - status:draft
body:
  - type: markdown
    attributes:
      value: |
        不必写完整，也不必先证明它对。一句话、一个问题、一个反例都可以。
        提交后进入待审核；讨论区即时公开，但收录进 `ideas/` 需要审核与整理。
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 你想让别人看到什么？一句话也可以。可以写问题、判断、反例或半成品方案。
      placeholder: 例如：如果让电磁波在封闭腔里完成计算，哪些物理量可以作为“程序状态”？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景、例子或可能的验证方式（可选）
      description: 为什么值得讨论？有没有相关链接、数据、反例或可复现步骤？
    validations:
      required: false
  - type: input
    id: links
    attributes:
      label: 相关链接（可选）
      description: 论文、项目、视频、语音或大文件的外链。
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: 附件说明（可选）
      description: 图片、视频、文件可在提交后的 Issue 正文中直接拖入；大文件请贴外链。语音可上传音频文件或贴链接。
    validations:
      required: false
  - type: input
    id: attribution
    attributes:
      label: 署名（可选）
      description: 希望如何署名；不填则使用 GitHub 用户名。
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交确认
      options:
        - label: 我确认内容为原创或有权公开，不含密钥、隐私数据或未授权材料；我理解讨论区即时公开，收录进 ideas/ 需审核。
          required: true
